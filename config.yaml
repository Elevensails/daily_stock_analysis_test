# =====================================================================
# config.yaml — U16 配置模块化：统一非敏感默认值层
# =====================================================================
# 作用：把散落在各脚本里的硬编码配置收敛到统一配置层，作为「环境变量 ▶
#       config.yaml ▶ 代码默认」三级优先级的中间层（详见 docs/system_design_u16.md）。
#
# 红线（务必遵守）：
#   * 本文件只允许存放【非敏感】的默认值，禁止写入任何密钥 / Token /
#     API Key / 密码等敏感信息（敏感配置继续走 .env / 环境变量）。
#   * 字段名与默认值必须与 src/config.py 中新增字段保持一致。
#   * 修改本文件不会破坏现有行为：当环境变量存在时以其为准，否则回退此处，
#     再否则回退代码默认（三层取值结果一致）。
# =====================================================================

# ---------------------------------------------------------------------
# model：模型相关默认（决策#7，全系统唯一主模型常量见 src/config.py:DEFAULT_LITELLM_MODEL）
# ---------------------------------------------------------------------
model:
  # 全系统唯一主模型。业务代码统一引用常量，禁止再硬编码裸串。
  default_litellm_model: "deepseek/deepseek-v4-flash"
  # repair 回退模型；留空表示回退到 default_litellm_model。
  repair_model: ""
  # repair loop 采样温度（范围 0.0 ~ 2.0）。
  repair_temperature: 0.1
  # run_vibe.py 写 agent/.env 时使用的 langchain 模型名。
  langchain_model_name: "deepseek-chat"
  # DeepSeek OpenAI 兼容接口基础地址（公开 URL，非敏感）。
  deepseek_base_url: "https://api.deepseek.com"

# ---------------------------------------------------------------------
# holdings：默认持仓（替代各脚本里散落的裸串 "600036,159915,603823,512400"）
# ---------------------------------------------------------------------
holdings:
  stock_list: "600036,159915,603823,512400"

# ---------------------------------------------------------------------
# analysis_style：生成后端风格
# ---------------------------------------------------------------------
analysis_style:
  # 生成后端（litellm / local_cli / ...），环境变量 GENERATION_BACKEND 优先。
  generation_backend: "litellm"

# ---------------------------------------------------------------------
# thresholds：各类阈值 / 开关默认（H1 默认行为对齐）
# ---------------------------------------------------------------------
thresholds:
  # repair 最大轮数（硬上限 3，超出会被 clamp）。U3 修改策略默认 1→2。
  repair_max_rounds: 2
  # U3 事后校验 gate 总开关。
  judge_enabled: true
  # 是否启用真实 LLM judge（false 时仅做规则校验）。
  judge_use_llm: false
  # U3 修改策略：安全降级发布开关（false 时轮数耗尽回退 reject-only，与旧行为一致）。
  # 环境变量 SAFE_DEGRADE_ENABLED 优先于此处。
  safe_degrade_enabled: true
  # 生成温度（LLM_TEMPERATURE 镜像，范围 0.0 ~ 2.0）。
  generation_temperature: 0.7
  # 生成 max_tokens 默认。
  max_tokens: 2048
  # 生成 max_output_tokens 默认。
  max_output_tokens: 8192
  # 新增 use_proxy 代理开关（false 时不写入任何代理环境变量）。
  use_proxy: false
  # 代理主机。
  proxy_host: "127.0.0.1"
  # 代理端口（范围 1 ~ 65535）。
  proxy_port: 10809
  # 默认时段，4 位 HHMM（如 "1800" 表示 18:00）。
  time_slot_default: "1800"
  # 报告输出目录。
  reports_dir: "reports"
  # 前端构建产物目录（deploy_pages.py 仅推送此目录）。
  dist_dir: "web/dist"

# ---------------------------------------------------------------------
# rag：U6 RAG（检索增强生成）配置
# ---------------------------------------------------------------------
rag:
  # RAG 总开关（env ENABLE_RAG 优先）。
  enable: true
  # neodata 子进程调用超时（秒）。
  neodata_timeout_seconds: 8.0
  # westock 子进程调用超时（秒）。
  westock_timeout_seconds: 5.0
  # 新闻标题去重前缀长度（UTF-8 字符数）。
  news_dedup_title_chars: 20
  # RAG prompt section 最大字符数（中文近似 token 数）。
  max_prompt_tokens: 1500

  # --- P1.6 新闻检索 CI 化（docs/p1.6-arch-design.md §3.4）---
  # neodata query.py 的绝对路径。留空则按候选路径自动探测；
  # CI 环境探测不到会直接跳过 neodata 并降级到 akshare，这是正常路径而非故障。
  neodata_script_path: ""
  # 是否启用 akshare stock_news_em 作为新闻兜底源（CI 首选可用源）。
  akshare_news_enabled: true
  # akshare 新闻单次调用超时（秒）。ak.stock_news_em 本身无 timeout 参数，
  # 由调用侧用线程池 future.result(timeout=) 强制截断。
  akshare_news_timeout_seconds: 12.0
  # akshare 新闻最多保留条数。
  akshare_news_max_items: 10
  # akshare 新闻回溯天数（超出则丢弃）。
  akshare_news_lookback_days: 7
  # akshare 新闻失败重试次数（0 = 不重试）。
  akshare_news_max_retries: 1
  # 新闻链路总时间预算（秒）。超预算后不再尝试后续数据源。
  news_total_budget_seconds: 25.0
  # true = 多源结果合并；false = 串行短路（默认，命中即停）。
  news_merge_sources: false
  # 命中多少条新闻才算"够用"；不足则继续尝试下一个数据源。
  news_min_items: 3

# ---------------------------------------------------------------------
# ltm：U14 长期记忆（语义召回层）配置
# ---------------------------------------------------------------------
# 设计：docs/system_design_u14_long_term_memory.md §3.4
# 对应 env：LTM_ENABLED / LTM_WRITE_ENABLED / LTM_WRITE_MODE /
#          LTM_EMBEDDING_PROVIDER / LTM_EMBEDDING_MODEL / LTM_EMBEDDING_DIM /
#          LTM_TOP_K / LTM_MIN_SIMILARITY / LTM_SCOPE / LTM_LOOKBACK_DAYS /
#          LTM_HALFLIFE_DAYS / LTM_MAX_PROMPT_TOKENS / LTM_JOINT_BUDGET_CHARS /
#          LTM_CONCLUSION_MAX_CHARS / LTM_EMBED_TIMEOUT_SECONDS /
#          LTM_MAX_CANDIDATES / LTM_RECALL_LOG_PATH
# 默认全关：enable=false 时主链路 prompt 逐字节不变，无任何新增开销。
ltm:
  # 语义召回总开关（env LTM_ENABLED 优先）。
  enable: false
  # 是否写入新向量。false = 只读召回已有记忆（不产生新的 embedding 开销）。
  write_enabled: true
  # 写入模式：
  #   batch_end — 单股只做文本抽取入内存缓冲（零网络），run 收尾一次性批量 embed + 落盘
  #   text_only — 只落结论文本，向量交给 scripts/backfill_ltm.py 离线补（CI 首选）
  #   off       — 完全不写
  write_mode: "batch_end"
  # embedding provider：auto（litellm 可用则用，否则降级 local）/ litellm / local。
  embedding_provider: "auto"
  # litellm 主路 embedding 模型（维度由服务端决定，text-embedding-3-small = 1536）。
  embedding_model: "openai/text-embedding-3-small"
  # 本地词法向量的投影维度（**仅 local provider 生效**，不影响 litellm）。
  embedding_dim: 1024
  # 单次召回返回的最大条数。
  top_k: 3
  # 原始余弦相似度阈值；低于此值不返回（阈值只卡原始相似度，不卡衰减后分数）。
  min_similarity: 0.75
  # 召回范围：same_stock（同标的，默认）/ global（跨标的，需 formatter 标注来源）。
  scope: "same_stock"
  # 回溯窗口（天）。0 = 不限制。
  lookback_days: 90
  # 时间衰减半衰期（天）：final = similarity * 0.5^(age/halflife)。0 = 关闭衰减。
  halflife_days: 60
  # LTM prompt section 最大字符数（中文近似 token 数，与 rag.max_prompt_tokens 同口径）。
  max_prompt_tokens: 500
  # rag + ltm 联合字符护栏：实际预算 = min(max_prompt_tokens, joint_budget_chars - len(rag_section))。
  # 预算 <= 0 时 LTM 段整体不注入（行情数据优先级恒高于历史观点）。
  joint_budget_chars: 2000
  # 单条结论文本的截断长度（入库前生效）。
  conclusion_max_chars: 500
  # embedding 调用超时（秒），对齐 rag.neodata_timeout_seconds。
  embed_timeout_seconds: 8.0
  # 单次召回加载的候选行数上界（内存护栏；1536 维 float32 下 20000 行 ≈ 117 MB）。
  max_candidates: 20000
  # 召回命中日志路径（jsonl，每次召回恰好一条，含 0 命中与降级场景）。
  recall_log_path: "logs/memory_recall.jsonl"

# ---------------------------------------------------------------------
# chip：P1.6 筹码数据反爬策略（CI 探测落到 B 分支）
# ---------------------------------------------------------------------
# 实证背景：GitHub Actions 上 ak.stock_cyq_em() 抛 RemoteDisconnected，
# 但同一 runner 裸 requests 直连东财 raw 接口返回 200 —— 判定为「akshare
# 封装层被反爬识别」，而非接口下线。因此默认开启请求头注入 + 有限重试。
# 对应 env：CHIP_FORCE_USER_AGENT / CHIP_REFERER / CHIP_MAX_RETRIES /
#          CHIP_RETRY_BACKOFF_SECONDS / CHIP_REQUEST_TIMEOUT_SECONDS /
#          CHIP_ALLOW_TUSHARE_FALLBACK / CHIP_DISABLE_AKSHARE
chip:
  # 是否给筹码请求注入 User-Agent / Referer（仅在筹码抓取期间临时生效）。
  force_user_agent: true
  # 注入的 Referer 头（东财对无 Referer 的机器请求更敏感）。
  referer: "https://quote.eastmoney.com"
  # 筹码抓取失败重试次数（0 = 不重试）。空数据不重试，仅网络类失败重试。
  max_retries: 0
  # 指数退避基数（秒）：第 n 次重试等待 backoff * 2^n。
  retry_backoff_seconds: 1.5
  # 单次筹码请求超时（秒）。akshare 内部不传 timeout，由补丁兜底注入；0 = 不注入。
  request_timeout_seconds: 10.0
  # 是否允许 tushare 兜底（需要配置 TUSHARE_TOKEN 才真正生效）。
  allow_tushare_fallback: true
  # 确认 akshare 筹码接口彻底不可用时置 true，直接整源关闭、省掉一次网络往返。
  disable_akshare: false

# ---------------------------------------------------------------------
# profiles：P2 预留结构（仅解析、不切换）
# ---------------------------------------------------------------------
# 当前为空。后续可按需定义多套配置，通过环境变量 CONFIG_PROFILE 指定激活的
# profile 名；U16 阶段仅保留 [profiles] 节点结构，不实现切换逻辑。
profiles: {}
