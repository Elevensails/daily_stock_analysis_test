name: A-Stock Daily Analysis

on:
  workflow_dispatch:
    inputs:
      time_slot:
        description: target time slot HHMM (blank=auto)
        required: false
        default: ""

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compute time slot
        run: |
          TSLOT="${{ inputs.time_slot }}"
          if [ -z "$TSLOT" ]; then
            TSLOT=$(python3 -c "from datetime import datetime,timezone,timedelta;print(datetime.now(timezone(timedelta(hours=8))).strftime('%H%M'))")
          fi
          echo "TSLOT=$TSLOT" >> $GITHUB_ENV
      - name: Run analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          STOCK_LIST: ${{ vars.STOCK_LIST }}
          GENERATION_BACKEND: litellm
          LITELLM_MODEL: deepseek/deepseek-v4-flash
        run: python main.py --no-notify
      - name: Rename reports
        env:
          TIME_SLOT: ${{ inputs.time_slot }}
        run: python3 scripts/rename_reports.py
      - name: XSS render gate
        run: python3 -m pytest tests/test_xss_escape.py -q
      - name: Ensure gh-pages orphan branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # First-deploy bootstrap (route b): the Contents API can only *update*
          # files, so on a brand-new repo the gh-pages branch must be created
          # out-of-band. We push an orphan branch with a .nojekyll marker from a
          # throwaway repo so the working tree (scripts/deploy_pages.py) is left
          # intact for the Deploy step.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages already exists on remote"
            exit 0
          fi
          WD=$(mktemp -d)
          git init "$WD"
          cd "$WD"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git symbolic-ref HEAD refs/heads/gh-pages
          printf '' > .nojekyll
          git add .nojekyll
          git commit -m "init gh-pages (nojekyll)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push origin gh-pages; then
            # Race guard: if a concurrent workflow already created gh-pages,
            # the orphan push is rejected (non-fast-forward) — that is fine.
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              echo "gh-pages already created by a concurrent run; OK"
              exit 0
            fi
            echo "FATAL: gh-pages push failed and branch is missing"
            exit 1
          fi
      - name: Deploy to GH Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy_pages.py
