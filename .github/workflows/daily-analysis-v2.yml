name: A-Stock Daily Analysis

on:
  workflow_dispatch:
    inputs:
      time_slot:
        description: target time slot HHMM (blank=auto)
        required: false
        default: ""

jobs:
  # =========================================================================
  # Job 1: 数据获取（仅拉取行情数据到 SQLite，不做 LLM 分析）
  # 超时设置 15min，独立享受 6h 配额，解决东财网络抖动超时问题
  # =========================================================================
  data-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compute time slot
        run: |
          TSLOT="${{ inputs.time_slot }}"
          if [ -z "$TSLOT" ]; then
            TSLOT=$(python3 -c "from datetime import datetime,timezone,timedelta;print(datetime.now(timezone(timedelta(hours=8))).strftime('%H%M'))")
          fi
          echo "TSLOT=$TSLOT" >> $GITHUB_ENV
      - name: Fetch data only (dry-run, no LLM)
        env:
          STOCK_LIST: ${{ vars.STOCK_LIST }}
          GENERATION_BACKEND: litellm
          LITELLM_MODEL: ${{ vars.DEFAULT_MODEL || 'deepseek/deepseek-v4-flash' }}
        run: python main.py --no-notify --dry-run --no-market-review
      - name: Upload fetched data artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetched-data-${{ github.run_id }}
          path: data/
          if-no-files-found: error
          retention-days: 1

  # =========================================================================
  # Job 2: 分析 + Judge + Emit + Deploy
  # 依赖 Job1 的数据 artifact，复刻原 workflow 所有后续步骤
  # 超时设置 25min，独立享受 6h 配额
  # =========================================================================
  analyze-emit:
    needs: data-fetch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download fetched data artifact
        uses: actions/download-artifact@v4
        with:
          name: fetched-data-${{ github.run_id }}
          path: data/
      - name: Compute time slot
        run: |
          TSLOT="${{ inputs.time_slot }}"
          if [ -z "$TSLOT" ]; then
            TSLOT=$(python3 -c "from datetime import datetime,timezone,timedelta;print(datetime.now(timezone(timedelta(hours=8))).strftime('%H%M'))")
          fi
          echo "TSLOT=$TSLOT" >> $GITHUB_ENV
      - name: Run analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          STOCK_LIST: ${{ vars.STOCK_LIST }}
          GENERATION_BACKEND: litellm   # 与仓库 config.yaml[analysis_style.generation_backend] 对齐
          LITELLM_MODEL: ${{ vars.DEFAULT_MODEL || 'deepseek/deepseek-v4-flash' }}
        run: python main.py --no-notify --force-run
      - name: Rename reports
        env:
          TIME_SLOT: ${{ inputs.time_slot }}
        run: python3 scripts/rename_reports.py
      - name: Emit frontend content contract
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_MODEL: ${{ vars.DEFAULT_MODEL || 'deepseek/deepseek-v4-flash' }}
        run: python3 scripts/emit_frontend_artifacts.py
      - name: Judge gate summary
        if: always()
        run: |
          if [ -f logs/judge_rejects.jsonl ]; then
            N=$(wc -l < logs/judge_rejects.jsonl | tr -d ' ')
          else
            N=0
          fi
          echo "JUDGE_REJECTS=$N"
          if [ "$N" -gt 0 ]; then
            echo "::warning::Judge 拦截 $N 份报告，已不发布（原因见 logs/judge_rejects.jsonl），待人工复核"
          else
            echo "Judge 未拦截任何报告"
          fi
      - name: Upload judge rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-rejects
          path: logs/judge_rejects.jsonl
          if-no-files-found: ignore
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (Vite MPA)
        working-directory: web
        run: npm ci && npm run build
      - name: XSS render gate
        run: python3 -m pytest tests/test_xss_escape.py -q
      - name: Deploy target gate
        run: python3 -m pytest tests/test_deploy_target.py -q
      - name: Ensure gh-pages orphan branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # First-deploy bootstrap (route b): the Contents API can only *update*
          # files, so on a brand-new repo the gh-pages branch must be created
          # out-of-band. We push an orphan branch with a .nojekyll marker from a
          # throwaway repo so the working tree (scripts/deploy_pages.py) is left
          # intact for the Deploy step.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages already exists on remote"
            exit 0
          fi
          WD=$(mktemp -d)
          git init "$WD"
          cd "$WD"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git symbolic-ref HEAD refs/heads/gh-pages
          printf '' > .nojekyll
          git add .nojekyll
          git commit -m "init gh-pages (nojekyll)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push origin gh-pages; then
            # Race guard: if a concurrent workflow already created gh-pages,
            # the orphan push is rejected (non-fast-forward) — that is fine.
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              echo "gh-pages already created by a concurrent run; OK"
              exit 0
            fi
            echo "FATAL: gh-pages push failed and branch is missing"
            exit 1
          fi
      - name: Deploy to GH Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Idempotently enable GitHub Pages using the workflow GITHUB_TOKEN
          # (which carries `pages:write` via the job `permissions:` block). This
          # is the primary enabler; the Python deploy below re-verifies and is
          # the source of truth for the final status. Tolerates 409 (already
          # enabled) and 403 (e.g. repo-level workflow-permission downgrade or a
          # concurrent run) so the step never fails solely on the enable call.
          if gh api -X POST "/repos/${GITHUB_REPOSITORY}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f 'source[branch]=gh-pages' -f 'source[path]=/' -f 'build_type=legacy' >/dev/null 2>&1; then
            echo "GitHub Pages enabled"
          else
            cur=$(gh api "/repos/${GITHUB_REPOSITORY}/pages" -H "Accept: application/vnd.github+json" --jq '.status' 2>/dev/null || true)
            if [ "$cur" = "built" ] || [ "$cur" = "enabled" ]; then
              echo "GitHub Pages enabled"
            else
              echo "GitHub Pages enable deferred to deploy script"
            fi
          fi
          python3 scripts/deploy_pages.py
